# Build signed DeepSeek Gestalt candidates, publish the standard update feed, and attach an unsigned Windows installer.
name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit to validate, package, or publish.
        required: true
        type: string
      version:
        description: Version shared by dsh and the Desktop application.
        required: true
        type: string
      operation:
        description: Validate inputs, build a signed candidate, or publish it. Candidate and publish always package an unsigned Windows installer.
        required: true
        type: choice
        default: validate
        options:
          - validate
          - candidate
          - publish
      deployment:
        description: Update feed embedded in the signed application and selected for publication.
        required: true
        type: choice
        default: test
        options:
          - test
          - production
      include_windows:
        description: Also build and publish signed Windows x64 with the required hardware-backed signer.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}-${{ inputs.deployment }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-24.04
    environment: desktop-dry-run
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: request
        name: Validate exact source and version
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DESKTOP_VERSION: ${{ inputs.version }}
          OPERATION: ${{ inputs.operation }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(node -p "require('./package.json').version")" = "$DESKTOP_VERSION"
          test "$(node -p "require('./apps/desktop/package.json').version")" = "$DESKTOP_VERSION"
          if [[ "$OPERATION" != validate ]]; then
            git fetch --no-tags origin refs/heads/master:refs/remotes/origin/master
            git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/master
          fi
          echo "version=$DESKTOP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=gestalt-v$DESKTOP_VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install release validation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate release configuration and artifact policy
        run: >-
          pnpm exec vitest run
          apps/desktop/tests/desktop-auto-update-environment.spec.ts
          apps/desktop/tests/desktop-upload-plan.spec.ts
          apps/desktop/tests/upload-target.spec.ts
          apps/desktop/tests/desktop-release-plan.spec.ts
          apps/desktop/tests/desktop-github-release-state.spec.ts
          apps/desktop/tests/app-icon.spec.ts

  pack-mac:
    name: Package macOS ${{ matrix.arch }}
    needs: prepare
    if: ${{ inputs.operation != 'validate' }}
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: mac-arm64
            runner: macos-15
          - arch: x64
            target: mac-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Materialize App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          node -e "const fs=require('node:fs'); const key=Buffer.from(process.env.APPLE_API_KEY_BASE64,'base64'); if (!key.toString().startsWith('-----BEGIN PRIVATE KEY-----')) throw new Error('invalid App Store Connect API key'); fs.writeFileSync(process.env.APPLE_API_KEY_PATH,key,{mode:0o600})"
          echo "APPLE_API_KEY=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Package signed and notarized application
        env:
          DSH_DESKTOP_APP_ID: ${{ vars.DESKTOP_RELEASE_APP_ID }}
          DSH_DESKTOP_AUTO_UPDATE_ENV: ${{ inputs.deployment }}
          DESKTOP_RELEASE_TEST_FEED_URL: ${{ vars.DESKTOP_RELEASE_TEST_FEED_URL }}
          DESKTOP_RELEASE_PRODUCTION_FEED_URL: ${{ vars.DESKTOP_RELEASE_PRODUCTION_FEED_URL }}
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ vars.DESKTOP_RELEASE_MACOS_SIGNING_IDENTITY }}
          DSH_DESKTOP_MACOS_TEAM_ID: ${{ vars.DESKTOP_RELEASE_MACOS_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PNPM_CONFIG_NETWORK_CONCURRENCY: ${{ vars.DESKTOP_RELEASE_PNPM_NETWORK_CONCURRENCY }}
          PNPM_CONFIG_FETCH_TIMEOUT: ${{ vars.DESKTOP_RELEASE_PNPM_FETCH_TIMEOUT }}
        run: pnpm run package:desktop:mac:${{ matrix.arch }}

      - name: Remove App Store Connect API key
        if: ${{ always() }}
        run: rm -f "$APPLE_API_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.zip
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.blockmap
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/*.yml
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/${{ matrix.target }}-release.json
          if-no-files-found: error
          retention-days: 14

  pack-win:
    name: Package Windows x64
    needs: prepare
    if: ${{ inputs.operation != 'validate' && inputs.include_windows }}
    runs-on: [self-hosted, windows, x64, dsh-win-ci]
    environment: desktop-release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Trust the checked-out Windows workspace
        shell: pwsh
        run: git config --global --add safe.directory "$($env:GITHUB_WORKSPACE.Replace('\', '/'))"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Materialize the public signing certificate
        shell: pwsh
        env:
          WINDOWS_CER_BASE64: ${{ secrets.DESKTOP_RELEASE_WINDOWS_CER_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CER_BASE64) { throw 'DESKTOP_RELEASE_WINDOWS_CER_BASE64 is required' }
          $path = Join-Path $env:RUNNER_TEMP 'desktop-release.cer'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CER_BASE64))
          "DSH_DESKTOP_WINDOWS_CER_FILE=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package signed application
        env:
          DSH_DESKTOP_APP_ID: ${{ vars.DESKTOP_RELEASE_APP_ID }}
          DSH_DESKTOP_AUTO_UPDATE_ENV: ${{ inputs.deployment }}
          DESKTOP_RELEASE_TEST_FEED_URL: ${{ vars.DESKTOP_RELEASE_TEST_FEED_URL }}
          DESKTOP_RELEASE_PRODUCTION_FEED_URL: ${{ vars.DESKTOP_RELEASE_PRODUCTION_FEED_URL }}
          DSH_DESKTOP_WINDOWS_SIGNTOOL: ${{ vars.DESKTOP_RELEASE_WINDOWS_SIGNTOOL }}
          DSH_DESKTOP_WINDOWS_KEY_CONTAINER: ${{ vars.DESKTOP_RELEASE_WINDOWS_KEY_CONTAINER }}
          DSH_DESKTOP_WINDOWS_TOKEN_PIN: ${{ secrets.DESKTOP_RELEASE_WINDOWS_TOKEN_PIN }}
          PNPM_CONFIG_NETWORK_CONCURRENCY: ${{ vars.DESKTOP_RELEASE_PNPM_NETWORK_CONCURRENCY }}
          PNPM_CONFIG_FETCH_TIMEOUT: ${{ vars.DESKTOP_RELEASE_PNPM_FETCH_TIMEOUT }}
        run: pnpm run package:desktop:win:x64

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x64
          path: |
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.yml
            apps/desktop/.desktop-build/targets/win-x64/artifacts/win-x64-release.json
          if-no-files-found: error
          retention-days: 14

  pack-win-unsigned:
    name: Package Windows x64 unsigned manual installer
    needs: prepare
    if: ${{ inputs.operation != 'validate' }}
    runs-on: windows-latest
    environment: desktop-dry-run
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Trust the checked-out Windows workspace
        shell: pwsh
        run: git config --global --add safe.directory "$($env:GITHUB_WORKSPACE.Replace('\', '/'))"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Package unsigned manual installer
        env:
          DSH_DESKTOP_APP_ID: ${{ vars.DESKTOP_RELEASE_APP_ID }}
          DSH_DESKTOP_AUTO_UPDATE_ENV: ${{ inputs.deployment }}
          DESKTOP_RELEASE_TEST_FEED_URL: ${{ vars.DESKTOP_RELEASE_TEST_FEED_URL }}
          DESKTOP_RELEASE_PRODUCTION_FEED_URL: ${{ vars.DESKTOP_RELEASE_PRODUCTION_FEED_URL }}
          PNPM_CONFIG_NETWORK_CONCURRENCY: ${{ vars.DESKTOP_RELEASE_PNPM_NETWORK_CONCURRENCY }}
          PNPM_CONFIG_FETCH_TIMEOUT: ${{ vars.DESKTOP_RELEASE_PNPM_FETCH_TIMEOUT }}
        run: pnpm run package:desktop:win:x64:unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win-x64-unsigned-manual
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.yml
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-x64-release.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ inputs.deployment }} update
    needs: [prepare, pack-mac, pack-win, pack-win-unsigned]
    if: >-
      ${{ always()
        && inputs.operation == 'publish'
        && needs.prepare.result == 'success'
        && needs.pack-mac.result == 'success'
        && needs.pack-win-unsigned.result == 'success'
        && (!inputs.include_windows || needs.pack-win.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install release uploader
        run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v5
        with:
          name: desktop-mac-arm64
          path: apps/desktop/.desktop-build/targets/mac-arm64/artifacts

      - uses: actions/download-artifact@v5
        with:
          name: desktop-mac-x64
          path: apps/desktop/.desktop-build/targets/mac-x64/artifacts

      - uses: actions/download-artifact@v5
        if: ${{ inputs.include_windows }}
        with:
          name: desktop-win-x64
          path: apps/desktop/.desktop-build/targets/win-x64/artifacts

      - uses: actions/download-artifact@v5
        if: ${{ !inputs.include_windows }}
        with:
          name: desktop-win-x64-unsigned-manual
          path: apps/desktop/.desktop-build/targets/win-x64/artifacts

      - uses: actions/download-artifact@v5
        with:
          name: desktop-win-x64-unsigned-manual
          path: ${{ runner.temp }}/desktop-win-x64-unsigned

      - name: Configure Alibaba Cloud OIDC credentials
        uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.DESKTOP_RELEASE_ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.DESKTOP_RELEASE_ALIYUN_ROLE_ARN }}
          role-session-name: gestalt-desktop-release-${{ github.run_id }}
          role-session-expiration: 3600
          audience: sts.aliyuncs.com

      - name: Upload immutable installers and blockmaps
        env:
          DSH_DESKTOP_AUTO_UPDATE_ENV: ${{ inputs.deployment }}
          DESKTOP_RELEASE_ALIYUN_REGION: ${{ vars.DESKTOP_RELEASE_ALIYUN_REGION }}
          DESKTOP_RELEASE_OSS_BUCKET: ${{ vars.DESKTOP_RELEASE_OSS_BUCKET }}
          DESKTOP_RELEASE_OSS_ENDPOINT: ${{ vars.DESKTOP_RELEASE_OSS_ENDPOINT }}
          DESKTOP_RELEASE_OSS_TIMEOUT_MS: ${{ vars.DESKTOP_RELEASE_OSS_TIMEOUT_MS }}
          DESKTOP_RELEASE_TEST_OSS_PREFIX: ${{ vars.DESKTOP_RELEASE_TEST_OSS_PREFIX }}
          DESKTOP_RELEASE_TEST_FEED_URL: ${{ vars.DESKTOP_RELEASE_TEST_FEED_URL }}
          DESKTOP_RELEASE_PRODUCTION_OSS_PREFIX: ${{ vars.DESKTOP_RELEASE_PRODUCTION_OSS_PREFIX }}
          DESKTOP_RELEASE_PRODUCTION_FEED_URL: ${{ vars.DESKTOP_RELEASE_PRODUCTION_FEED_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @deepseek-ai/dsh-desktop upload:mac:arm64 --phase immutable
          pnpm --filter @deepseek-ai/dsh-desktop upload:mac:x64 --phase immutable
          pnpm --filter @deepseek-ai/dsh-desktop upload:win:x64 --phase immutable

      - name: Prepare production GitHub Release
        if: ${{ inputs.deployment == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DSH_DESKTOP_AUTO_UPDATE_ENV: ${{ inputs.deployment }}
          DESKTOP_RELEASE_ALIYUN_REGION: ${{ vars.DESKTOP_RELEASE_ALIYUN_REGION }}
          DESKTOP_RELEASE_OSS_BUCKET: ${{ vars.DESKTOP_RELEASE_OSS_BUCKET }}
          DESKTOP_RELEASE_OSS_ENDPOINT: ${{ vars.DESKTOP_RELEASE_OSS_ENDPOINT }}
          DESKTOP_RELEASE_OSS_TIMEOUT_MS: ${{ vars.DESKTOP_RELEASE_OSS_TIMEOUT_MS }}
          DESKTOP_RELEASE_TEST_OSS_PREFIX: ${{ vars.DESKTOP_RELEASE_TEST_OSS_PREFIX }}
          DESKTOP_RELEASE_TEST_FEED_URL: ${{ vars.DESKTOP_RELEASE_TEST_FEED_URL }}
          DESKTOP_RELEASE_PRODUCTION_OSS_PREFIX: ${{ vars.DESKTOP_RELEASE_PRODUCTION_OSS_PREFIX }}
          DESKTOP_RELEASE_PRODUCTION_FEED_URL: ${{ vars.DESKTOP_RELEASE_PRODUCTION_FEED_URL }}
        run: |
          set -euo pipefail
          targets='mac-arm64,mac-x64,win-x64'
          pnpm --filter @deepseek-ai/dsh-desktop release:plan -- \
            --artifacts-root apps/desktop/.desktop-build/targets \
            --targets "$targets" \
            --output-json "${{ runner.temp }}/desktop-release.json" \
            --output-body "${{ runner.temp }}/desktop-release.md"
          tag=$(jq -r .tag "${{ runner.temp }}/desktop-release.json")
          title=$(jq -r .title "${{ runner.temp }}/desktop-release.json")
          prerelease=$(jq -r .prerelease "${{ runner.temp }}/desktop-release.json")
          tag_sha=$(git ls-remote --refs origin "refs/tags/$tag" | awk '{print $1}')
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
            jq -cs --arg tag "$tag" '[.[] | .[] | select(.tag_name == $tag)]')
          test "$(jq length <<<"$releases")" -le 1
          release=$(jq -c '.[0] // empty' <<<"$releases")
          pnpm exec tsx apps/desktop/scripts/desktop-github-release-state.ts \
            "${{ inputs.candidate_sha }}" "$tag_sha" "$release"
          if [[ -n "$release" ]]; then
            gh release edit "$tag" --title "$title" --notes-file "${{ runner.temp }}/desktop-release.md" \
              --prerelease="$prerelease"
          else
            release_args=()
            if [[ "$prerelease" == true ]]; then release_args+=(--prerelease); fi
            gh release create "$tag" --draft --target "${{ inputs.candidate_sha }}" \
              --title "$title" --notes-file "${{ runner.temp }}/desktop-release.md" "${release_args[@]}"
          fi
          mapfile -t unsigned_windows < <(find "${{ runner.temp }}/desktop-win-x64-unsigned" -name '*.exe' -type f | sort)
          test "${#unsigned_windows[@]}" -eq 1
          gh release upload "$tag" "${unsigned_windows[0]}" --clobber

      - name: Publish update channel metadata
        env:
          DSH_DESKTOP_AUTO_UPDATE_ENV: ${{ inputs.deployment }}
          DESKTOP_RELEASE_ALIYUN_REGION: ${{ vars.DESKTOP_RELEASE_ALIYUN_REGION }}
          DESKTOP_RELEASE_OSS_BUCKET: ${{ vars.DESKTOP_RELEASE_OSS_BUCKET }}
          DESKTOP_RELEASE_OSS_ENDPOINT: ${{ vars.DESKTOP_RELEASE_OSS_ENDPOINT }}
          DESKTOP_RELEASE_OSS_TIMEOUT_MS: ${{ vars.DESKTOP_RELEASE_OSS_TIMEOUT_MS }}
          DESKTOP_RELEASE_TEST_OSS_PREFIX: ${{ vars.DESKTOP_RELEASE_TEST_OSS_PREFIX }}
          DESKTOP_RELEASE_TEST_FEED_URL: ${{ vars.DESKTOP_RELEASE_TEST_FEED_URL }}
          DESKTOP_RELEASE_PRODUCTION_OSS_PREFIX: ${{ vars.DESKTOP_RELEASE_PRODUCTION_OSS_PREFIX }}
          DESKTOP_RELEASE_PRODUCTION_FEED_URL: ${{ vars.DESKTOP_RELEASE_PRODUCTION_FEED_URL }}
        run: |
          set -euo pipefail
          pnpm --filter @deepseek-ai/dsh-desktop upload:mac:arm64 --phase channel
          pnpm --filter @deepseek-ai/dsh-desktop upload:mac:x64 --phase channel
          pnpm --filter @deepseek-ai/dsh-desktop upload:win:x64 --phase channel

      - name: Publish GitHub Release
        if: ${{ inputs.deployment == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
          tag_sha=$(git ls-remote --refs origin "refs/tags/${{ needs.prepare.outputs.tag }}" | awk '{print $1}')
          test "$tag_sha" = '${{ inputs.candidate_sha }}'
