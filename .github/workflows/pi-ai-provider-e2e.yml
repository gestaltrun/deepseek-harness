name: E2E (pi-ai Azure OpenAI)

# This suite spends tokens against Azure OpenAI and is intentionally
# opt-in. It has no push, pull_request, schedule, or workflow_call trigger.
on:
  workflow_dispatch:
    inputs:
      azure_openai_model:
        description: Azure OpenAI model from pi-ai's installed catalog
        required: true
        default: gpt-5.5
        type: string

permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Azure OpenAI Responses
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The tests self-skip locally when a credential is absent. A manually
      # dispatched CI run must fail instead of reporting an all-skipped green.
      - name: Preflight (require Azure OpenAI API key)
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_OPENAI_API_KEY:-}" ]; then
            echo "::error::AZURE_OPENAI_API_KEY is empty. Configure AZURE_OPENAI_API_KEY_EXTERNAL."
            exit 1
          fi

      - name: E2E tests (real Azure OpenAI API)
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY_EXTERNAL }}
          DSH_PI_AI_OPENAI_MODEL: ${{ inputs.azure_openai_model }}
          DSH_PI_AI_OPENAI_BASE_URL: https://openai-routerhub-resource.services.ai.azure.com/api/projects/openai/openai/v1
          DSH_E2E_MAX_WORKERS: 2
        run: >-
          pnpm exec vitest run --config vitest.e2e.config.ts
          packages/llm/llm-pi-ai/tests/provider-apis.e2e.ts
          --testNamePattern '^llm-pi-ai openai e2e'
